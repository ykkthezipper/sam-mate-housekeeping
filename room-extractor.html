  box-shadow: var(--shadow);
  padding: 20px;
}

.sam-card.is-complete {

}

.sam-card-header {

  justify-content: space-between;

.sam-card-header h3 {

}

.sam-state {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  border-radius: 8px;
  background: var(--amber-soft);
  color: var(--amber);
  padding: 6px 10px;
  font-size: 0.92rem;
  font-weight: 900;
}

.sam-state.complete {
  background: var(--primary-soft);
  color: var(--success);
}

.unified-sam-editor {
  border-top: 1px solid var(--line);

  padding-top: 18px;
}

.unified-sam-editor h4 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.learner-intro,
.safety-review-note {
  color: var(--muted);
  margin-bottom: 12px;
}

.personalise-note {
  border-left: 4px solid var(--primary);
  background: var(--primary-soft);
  margin: 0 0 14px;
  padding: 10px 12px;
  font-size: 0.96rem;
  font-weight: 800;
  line-height: 1.55;
}

.translation-note {
  color: var(--primary-strong);
  margin: -2px 0 0;
  font-size: 0.94rem;
  font-weight: 800;
  line-height: 1.5;
}

.hazard-review-progress {
  border-left: 4px solid var(--amber);
  background: var(--amber-soft);
  color: #6f4300;
  margin: 0 0 14px;
  padding: 10px 12px;
  font-size: 0.96rem;
  font-weight: 900;
  line-height: 1.5;
}

.hazard-picker {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin: 4px 0 14px;
}

.hazard-picker > summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  padding: 12px 0;
  color: var(--text);
  font-weight: 900;
}

.hazard-picker-summary-count {
  color: var(--primary-strong);
  font-size: 0.94rem;
  white-space: nowrap;
}

.hazard-picker-content {
  padding: 2px 0 16px;
}

.sam-hazard-choice-list {
  max-height: 250px;
}

.hazard-picker-apply {
  width: 100%;
}

.hazard-editor-list {
  border-top: 1px solid var(--line);
  margin-top: 8px;
}

.hazard-editor-group {
  border-bottom: 1px solid var(--line);
  padding: 5px 0;
}

.hazard-editor-group.is-reviewed > summary {
  color: var(--success);
}

.hazard-editor-group > summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 10px;
  min-height: 64px;
  padding: 12px 0;
  color: var(--text);
  font-weight: 900;
}

.hazard-editor-content {
  padding: 2px 0 14px;
}

.editable-control-order {
  margin-top: 12px;
}

.hierarchy-help,
.hierarchy-context-note,
.hierarchy-source {
  color: var(--muted);
  font-size: 0.94rem;
  line-height: 1.55;
}

.hierarchy-help {
  margin: 0 0 9px;
  font-weight: 750;
}

.hierarchy-guide {
  border-left: 3px solid var(--primary);
  background: var(--primary-soft);
  margin-top: 12px;
  padding: 8px 10px;
}

.hierarchy-guide > summary {
  min-height: 52px;
  padding: 4px 0;
  color: var(--primary-strong);
  font-size: 0.94rem;
  font-weight: 900;
}

.hierarchy-guide-list {
  margin: 8px 0 7px;
  padding-left: 22px;
}

.hierarchy-guide-list li + li {
  margin-top: 8px;
}

.hierarchy-guide-list strong,
.hierarchy-guide-list span {
  display: block;
}

.hierarchy-guide-list strong {
  font-size: 0.94rem;
}

.hierarchy-guide-list span {
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.5;
}

.hierarchy-source {
  margin: 8px 0 0;
}

.hierarchy-control-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.hierarchy-control-list.is-dragging {
  user-select: none;
}

.hierarchy-control-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 52px;
  align-items: start;
  gap: 9px;
  min-height: 72px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  padding: 7px 7px 7px 10px;
  transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
}

.hierarchy-control-row.is-dragging {
  border-color: var(--primary);
  box-shadow: 0 5px 14px rgba(10, 77, 60, 0.16);
  opacity: 0.76;
}

.hierarchy-position {
  display: grid;
  width: 32px;
  height: 32px;
  margin-top: 8px;
  place-items: center;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--primary-strong);
  font-size: 0.9rem;
  font-weight: 900;
}

.editable-control-field {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.editable-control-field input {
  width: 100%;
  min-height: 56px;
  border-color: transparent;
  background: #f7f9f8;
  padding: 8px 10px;
}

.editable-control-field input:hover,
.editable-control-field input:focus {
  border-color: var(--primary);
  background: var(--surface);
}

.editable-control-field .translation-note {
  margin: 2px 2px 0;
}

.hierarchy-drag-handle {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: grab;
  margin-top: 1px;
  touch-action: none;
}

.hierarchy-drag-handle:hover,
.hierarchy-drag-handle:focus-visible {
  border-color: var(--line);
  background: var(--primary-soft);
  color: var(--primary-strong);
}

.hierarchy-drag-handle:active {
  cursor: grabbing;
}

.hierarchy-grip {
  display: grid;
  gap: 4px;
  width: 22px;
}

.hierarchy-grip span {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
}

.hierarchy-context-note {
  margin: 12px 0 0;
}

.hazard-review-title {
  min-width: 0;
  overflow-wrap: anywhere;
}

.hazard-reviewed-state {
  align-self: start;
  color: var(--success);
  font-size: 0.92rem;
  font-weight: 850;
  white-space: nowrap;
}

.safety-review-note {
  border-top: 1px solid var(--line);
  margin: 15px 0 0;
  padding-top: 13px;
  font-size: 0.96rem;
  font-weight: 800;
}

.signature-row {
  border-top: 1px solid var(--line);
  margin-top: 18px;
  padding-top: 16px;
}

.signature-row h4 {
  margin: 0 0 6px;
  font-size: 1rem;
}

.signature-row > p {
  color: var(--muted);
  margin: 0 0 13px;
  font-size: 0.96rem;
  font-weight: 750;
}

.signature-row .control-row {
  margin-bottom: 10px;
}

.signature-row .check-row {
  color: var(--text);
  font-size: 1rem;
}

.signature-row:has(input[data-signature-name]:disabled) {
  color: var(--muted);
  opacity: 0.72;
}

.signature-options {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.signature-status {
  color: var(--success);
  margin: 10px 0 0;
  font-size: 0.94rem;
  font-weight: 900;
}

.copy-workflow {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}

.copy-workflow .primary-button {
  width: 100%;
  min-height: 64px;
}

.copy-preview {
  border-left: 4px solid var(--primary);
  background: var(--navy-soft);
  padding: 11px 12px;
}

.copy-preview-label {
  margin: 0 0 6px;
  color: var(--primary-strong);
  font-size: 0.94rem;
  font-weight: 900;
  text-transform: uppercase;
}

.copy-preview pre {
  margin: 0;
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 750;
  line-height: 1.45;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.copy-steps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
}

.copy-step {
  min-height: 7px;
  border-radius: 8px;
  background: #dfe7e4;
}

.copy-step.active,
.copy-step.done {
  background: var(--primary);
}

.workflow-note {
  color: var(--muted);
  margin: 0;
  font-size: 0.94rem;
  font-weight: 700;
}

.primary-button.copied {
  background: var(--success);
}

.empty-state {
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
  padding: 24px;
  text-align: center;
  font-weight: 800;
}

.utility-section summary {
  min-height: 64px;
  padding: 16px 0;
  font-size: 1rem;
  font-weight: 900;
}

.utility-section .language-request-details > summary {
  padding: 12px 14px;
}

.utility-content {
  padding: 10px 0 4px;
}

.utility-heading {
  margin-bottom: 20px;
}

.preferences-panel {
  border-top: 1px solid var(--line);
  margin-top: 22px;
  padding-top: 20px;
}

.preferences-panel > h3 {
  margin-bottom: 12px;
}

.saved-wording-heading {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 16px;
  border-top: 1px solid var(--line);
  margin-top: 20px;
  padding-top: 18px;
}

.saved-wording-heading h3 {
  margin-bottom: 4px;
}

.saved-wording-heading p {
  margin-bottom: 0;
}

.saved-wording-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.review-export-panel {
  display: grid;
  gap: 12px;
  border-top: 1px solid var(--line);
  margin-top: 16px;
  padding-top: 16px;
}

.review-export-panel[hidden] {
  display: none;
}

.review-export-panel p {
  margin: 0;
  color: var(--muted);
  font-size: 0.94rem;
  font-weight: 700;
  line-height: 1.5;
}

.review-export-panel .secondary-button {
  justify-self: start;
}

.saved-wording-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
}

.saved-wording-item p {
  margin: 0;
  overflow-wrap: anywhere;
}

.saved-wording-item .saved-work-type {
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 750;
}

.delete-wording-button {
  width: 52px;
  min-height: 52px;
  border-radius: 8px;
  background: transparent;
  color: var(--danger);
  font-size: 1.45rem;
  font-weight: 800;
}

.delete-wording-button:hover {
  background: #fff0ee;
}

.compact-button {
  flex: 0 0 auto;
  min-height: 52px;
  padding-inline: 8px;
}

.utility-actions {
  border-top: 1px solid var(--line);
  margin-top: 18px;
  padding-top: 8px;
}

.template-layout {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 28px;
}

.template-form {
  padding: 0;
}

.three-field-grid {
  display: grid;
  gap: 2px;
}

.settings-row {
  border-top: 1px solid var(--line);
  margin-top: 24px;
  padding-top: 10px;
}

.about-copy {
  max-width: 720px;
}

.about-copy h3 {
  margin: 24px 0 8px;
}

.content-version {
  border-left: 4px solid var(--primary);
  padding-left: 12px;
  font-size: 0.94rem;
  font-weight: 900;
}

.project-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.secondary-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.tools-body {
  min-height: 100vh;
  background: var(--surface);
}

.tools-shell {
  width: min(720px, calc(100% - 32px));
  margin: 0 auto;
}

.tools-header {
  position: sticky;
  z-index: 10;
  top: 0;
}

.tools-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 92px;
  padding: 14px 0;
}

.tools-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-link {
  color: inherit;
  text-decoration: none;
}

.brand-link .eyebrow {
  display: block;
}

.tools-brand-title {
  display: block;
  font-size: 1.3rem;
  font-weight: 900;
  line-height: 1.15;
}

.tools-language {
  position: relative;
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  color: var(--primary);
}

.tools-language-icon {
  position: absolute;
  z-index: 1;
  left: 11px;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
  pointer-events: none;
}

.tools-language select {
  width: 108px;
  min-height: 56px;
  border-color: var(--line);
  background: var(--surface);
  padding: 9px 9px 9px 38px;
  font-size: 0.94rem;
  font-weight: 900;
}

.tools-main {
  padding: 34px 0 42px;
}

.tools-intro {
  padding-bottom: 30px;
}

.tools-intro .date-line {
  margin-bottom: 9px;
  color: var(--primary);
  font-size: 0.94rem;
  text-transform: uppercase;
}

.tools-intro h1 {
  max-width: 620px;
  margin-bottom: 8px;
  font-size: 2rem;
}

.tools-intro > p:last-child {
  max-width: 600px;
  margin-bottom: 0;
  color: var(--muted);
}

.sam-tool {
  border-block: 1px solid var(--line);
  background: var(--primary-soft);
  padding: 26px 24px;
}

.sam-tool-heading {
  display: flex;
  align-items: center;
  gap: 14px;
}

.sam-tool-heading h2,
.tools-section-heading h2 {
  margin-bottom: 0;
}

.tool-kicker {
  margin-bottom: 2px;
  color: var(--primary);
  font-size: 0.92rem;
  font-weight: 900;
  text-transform: uppercase;
}

.sam-tool-description {
  max-width: 590px;
  margin: 16px 0 18px;
  color: var(--muted);
}

.tool-primary-link {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #ffffff;
  text-decoration: none;
}

.tool-primary-link svg,
.tool-text-link svg,
.tool-row-arrow,
.details-chevron {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.tool-text-link {
  display: inline-flex;
  min-height: 52px;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  padding-block: 8px;
  color: var(--primary-strong);
  font-size: 1rem;
  font-weight: 900;
  text-decoration: none;
}

.tool-text-link:hover {
  text-decoration: underline;
}

.site-forms {
  padding: 34px 0 18px;
}

.tools-section-heading {
  margin-bottom: 16px;
}

.tool-list {
  border-block: 1px solid var(--line);
}

.tool-row {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 24px;
  align-items: center;
  gap: 14px;
  min-height: 100px;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  padding: 14px 4px;
  text-decoration: none;
}

.tool-row:last-child {
  border-bottom: 0;
}

.tool-row:hover {
  background: var(--bg);
}

.tool-row-copy {
  display: grid;
  min-width: 0;
  gap: 2px;
}

.tool-row-copy strong {
  font-size: 1.08rem;
  line-height: 1.28;
}

.tool-row-copy > span {
  color: var(--muted);
  font-size: 0.94rem;
  line-height: 1.5;
}

.tool-row-arrow {
  color: var(--muted);
}

.tool-icon {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  border-radius: 8px;
  color: var(--primary);
  background: var(--primary-soft);
}

.tool-icon svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.tool-icon-primary {
  color: #ffffff;
  background: var(--primary);
}

.tool-icon-alert {
  color: var(--danger);
  background: #fbe9e6;
}

.tool-icon-fitness {
  color: #9a3f61;
  background: #f7e7ed;
}

.tool-icon-travel {
  color: #326b9b;
  background: #e6f0f8;
}

.tool-icon-attendance {
  color: #7b5600;
  background: var(--amber-soft);
}

.tool-icon-register {
  color: #5e4c84;
  background: #eee9f7;
}

.coverage-request {
  border-block: 1px solid var(--line);
  margin-top: 22px;
}

.coverage-request summary {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 24px;
  align-items: center;
  gap: 14px;
  min-height: 100px;
  list-style: none;
  padding: 14px 4px;
}

.coverage-request summary::-webkit-details-marker {
  display: none;
}

.coverage-request summary > span:nth-child(2) {
  display: grid;
  gap: 2px;
}

.coverage-request summary strong {
  line-height: 1.3;
}

.coverage-request summary span span {
  color: var(--muted);
  font-size: 0.94rem;
  line-height: 1.5;
}

.tool-icon-coverage {
  color: var(--primary);
  background: var(--navy-soft);
}

.details-chevron {
  color: var(--muted);
  transition: transform 160ms ease;
}

.coverage-request[open] .details-chevron {
  transform: rotate(180deg);
}

.coverage-content {
  border-top: 1px solid var(--line);
  padding: 18px 4px 22px 70px;
}

.coverage-content p {
  margin-bottom: 12px;
  color: var(--muted);
}

.coverage-content ul {
  margin: 0 0 18px;
  padding-left: 20px;
}

.coverage-content li + li {
  margin-top: 7px;
}

.tools-footer {
  border-top: 1px solid var(--line);
  background: var(--bg);
  padding: 24px 0 calc(24px + env(safe-area-inset-bottom));
}

.tools-footer p {
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.5;
}

.tools-footer p:last-child {
  margin-bottom: 0;
  font-weight: 800;
}

@media (max-width: 680px) {
  .shell {
    width: min(100% - 32px, 860px);
  }

  .header-inner {
    align-items: stretch;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .language-control {
    flex-basis: auto;
  }

  .header-actions {
    align-items: flex-end;
    gap: 8px;
  }

  .header-actions .language-control {
    flex: 1 1 auto;
    min-width: 0;
  }

  .header-meta-line {
    display: block;
    max-width: calc(100vw - 116px);
  }

  .header-meta-divider {
    display: none;
  }

  .daily-thought-inline {
    display: none;
  }

  .header-release-panel {
    right: auto;
    left: -64px;
    width: calc(100vw - 32px);
  }

  h1 {
    font-size: 1.8rem;
  }

  .start-section,
  .practice-section,
  .results-section,
  .utility-section {
    padding: 24px 0;
  }

  .start-grid,
  .start-actions,
  .personal-task-grid,
  .three-field-grid,
  .hazard-choice-list,
  .progress-heading,
  .template-layout,
  .practice-options,
  .copy-format-panel {
    grid-template-columns: 1fr;
  }

  .copy-format-controls {
    grid-template-columns: 1fr;
  }

  .progress-track {
    margin-bottom: 4px;
  }

  .sam-card {
    padding: 18px;
  }

  .practice-actions .primary-button,
  .practice-actions .secondary-button,
  .start-actions .primary-button,
  .start-actions .secondary-button,
  .secondary-button,
  .secondary-link {
    width: 100%;
  }

  .practice-source-row {
    grid-template-columns: 1fr;
  }

  .learning-entry,
  .practice-spelling-row {
    grid-template-columns: 1fr;
  }

  .learning-entry-button,
  .practice-spelling-row button {
    width: 100%;
  }

  .saved-wording-heading {
    align-items: stretch;
    flex-direction: column;
  }

  .tools-shell {
    width: min(100% - 32px, 720px);
  }

  .tools-header-inner {
    min-height: 78px;

"use strict";

(function exposeRoomParser(root, factory) {
  const parser = factory();
  if (typeof module === "object" && module.exports) module.exports = parser;

})(typeof globalThis !== "undefined" ? globalThis : this, function createRoomParser() {
  const ROOM_PATTERN = /^[A-Z]\d{3}$/;
  const DEFAULT_TYPES = Object.freeze(["DA", "DC", "TA", "TC", "F"]);

  function parseRoomList(input, options = {}) {
    const allowedTypes = new Set((options.allowedTypes || DEFAULT_TYPES).map(normalizeToken));
    const source = String(input || "").replace(/\r\n?/g, "\n");
    const records = [];
    const errors = [];

    source.split("\n").forEach((rawLine, lineIndex) => {
      const line = rawLine.trim();
      if (!line) return;

      const tokens = line.replace(/[，,;|]+/g, " ").split(/\s+/).filter(Boolean);
      if (isHeader(tokens)) return;

      if (tokens.length % 2 !== 0) {
        errors.push({
          line: lineIndex + 1,
          input: rawLine,
          message: `Line ${lineIndex + 1}: use room,type pairs, for example B125,TC.`
        });
        return;
      }

      for (let index = 0; index < tokens.length; index += 2) {
        const room = normalizeToken(tokens[index]);
        const type = normalizeToken(tokens[index + 1]);
        const pair = `${tokens[index]} ${tokens[index + 1]}`;

        if (!ROOM_PATTERN.test(room)) {
          errors.push({
            line: lineIndex + 1,
            input: pair,
            message: `Line ${lineIndex + 1}: "${tokens[index]}" is not a valid room. Use one letter and exactly 3 digits, for example B125.`
          });
          continue;
        }

        if (!allowedTypes.has(type)) {
          errors.push({
            line: lineIndex + 1,
            input: pair,
            message: `Line ${lineIndex + 1}: "${tokens[index + 1]}" is not a supported type. Use ${[...allowedTypes].join(", ")}.`
          });
          continue;
        }

        records.push({ room, type, line: lineIndex + 1 });
      }
    });

    const firstByRoom = new Map();
    const duplicateRows = [];
    const conflictsByRoom = new Map();

    records.forEach((record) => {
      const first = firstByRoom.get(record.room);
      if (!first) {
        firstByRoom.set(record.room, record);
        return;
      }
      if (first.type === record.type) {
        duplicateRows.push(record);
        return;
      }
      const types = conflictsByRoom.get(record.room) || new Set([first.type]);
      types.add(record.type);
      conflictsByRoom.set(record.room, types);
    });

    const conflicts = [...conflictsByRoom.entries()].map(([room, types]) => ({
      room,
      types: [...types],
      message: `${room} has conflicting types: ${[...types].join(" and ")}. Correct it before copying.`
    }));
    const conflictedRooms = new Set(conflictsByRoom.keys());
    const validRows = [...firstByRoom.values()]
      .filter((record) => !conflictedRooms.has(record.room))
      .map(({ room, type }) => ({ room, type }));
    const csv = ["room,type", ...validRows.map(({ room, type }) => `${room},${type}`)].join("\n");
    const roomsText = validRows.map(({ room }) => room).join("\n");

    return {
      validRows,
      validUniqueRoomCount: validRows.length,
      duplicateCount: duplicateRows.length,
      conflicts,
      errors,
      csv,
      roomsText,
      isEmpty: source.trim().length === 0
    };
  }

  function normalizeToken(value) {
    return String(value || "").trim().toUpperCase();
  }

  function isHeader(tokens) {
    return tokens.length === 2
      && normalizeToken(tokens[0]) === "ROOM"
      && normalizeToken(tokens[1]) === "TYPE";
  }

  return Object.freeze({
    DEFAULT_TYPES,
    ROOM_PATTERN,
    parseRoomList
  });
});

    <script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {
  const parser = globalThis.SAMRoomParser;
  const config = globalThis.SAM_APP_CONFIG || {};
  const demoData = globalThis.SAM_DEMO_DATA || {};
  const input = document.querySelector("#roomInput");
  const normalizeButton = document.querySelector("#normalizeRoomsBtn");
  const sampleButton = document.querySelector("#loadRoomSampleBtn");
  const resetButton = document.querySelector("#resetRoomToolBtn");
  const count = document.querySelector("#roomValidCount");
  const summary = document.querySelector("#roomSummary");
  const issues = document.querySelector("#roomIssues");
  const csvOutput = document.querySelector("#roomCsvOutput");
  const roomsOutput = document.querySelector("#roomListOutput");
  const copyCsv = document.querySelector("#copyRoomCsvBtn");
  const copyRooms = document.querySelector("#copyRoomListBtn");

  document.querySelector("#roomPrototypeNotice").textContent = config.prototypeNotice || "Prototype demonstration only.";
  document.querySelector("#roomTypeHelp").textContent = `Supported types: ${(config.supportedRoomTypes || parser.DEFAULT_TYPES).join(", ")}.`;

  function render() {
    const result = parser.parseRoomList(input.value, { allowedTypes: config.supportedRoomTypes });
    count.textContent = String(result.validUniqueRoomCount);
    csvOutput.value = result.csv;
    roomsOutput.value = result.roomsText;
    copyCsv.disabled = result.validUniqueRoomCount === 0;
    copyRooms.disabled = result.validUniqueRoomCount === 0;

    const messages = [];
    if (result.isEmpty) {
      summary.textContent = "Paste a room list to begin.";
    } else {
      summary.textContent = `${result.validUniqueRoomCount} valid unique room${result.validUniqueRoomCount === 1 ? "" : "s"}. ${result.duplicateCount} duplicate${result.duplicateCount === 1 ? "" : "s"} removed.`;
    }
    result.conflicts.forEach((conflict) => messages.push({ kind: "conflict", text: conflict.message }));
    result.errors.forEach((error) => messages.push({ kind: "error", text: error.message }));
    issues.replaceChildren(...messages.map(({ kind, text }) => {
      const item = document.createElement("li");
      item.className = `room-issue ${kind}`;
      item.textContent = text;
      return item;
    }));
    issues.hidden = messages.length === 0;
  }

  normalizeButton.addEventListener("click", render);
  input.addEventListener("input", render);
  sampleButton.addEventListener("click", () => {
    input.value = demoData.roomExtractionSample || "room,type\nB125,TC";
    render();
    input.focus();
  });
  resetButton.addEventListener("click", () => {
    input.value = "";
    render();
    input.focus();
  });
  copyCsv.addEventListener("click", () => copyOutput(csvOutput.value, copyCsv));
  copyRooms.addEventListener("click", () => copyOutput(roomsOutput.value, copyRooms));

  render();
  registerRoomToolServiceWorker();
});

async function copyOutput(value, button) {
  if (!value) return;
  const original = button.textContent;
  try {
    await navigator.clipboard.writeText(value);
    button.textContent = "Copied";
  } catch (error) {
    const field = document.createElement("textarea");
    field.value = value;
    field.style.position = "fixed";
    field.style.left = "-9999px";
    document.body.appendChild(field);
    field.select();
    document.execCommand("copy");
    field.remove();
    button.textContent = "Copied";
  }
  window.setTimeout(() => { button.textContent = original; }, 1400);
}

function registerRoomToolServiceWorker() {
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(window.location.protocol)) return;
  navigator.serviceWorker.register("service-worker.js").catch((error) => {
    console.warn("Offline cache could not be registered.", error);
  });
}
